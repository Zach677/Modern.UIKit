name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tooling:
    name: Tooling tests and xcstrings gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Run tooling unit tests
        run: mise run test-tooling
      - name: Validate string catalogs
        run: mise run validate-xcstrings

  app:
    name: Build and test app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Build for iOS Simulator
        run: mise run build
      - name: Run Core and app tests
        run: mise run test
