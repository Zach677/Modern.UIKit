# ModernUIKit task automation.
#
# mise is the public and implementation-level task runner for this repository.
# Build and test tasks still route Xcode through the DevKit log-aware wrapper so
# xcodebuild logs, not only process exit codes, remain the source of truth.

[task_config]
dir = "{{config_root}}"

[tasks.default]
description = "Build iOS Simulator and Mac Catalyst"
run = [{ task = "build" }]

[tasks.help]
description = "Show project task help"
run = "mise tasks"

[tasks.build]
description = "Build iOS Simulator and Mac Catalyst"
run = [{ task = "build-sim" }, { task = "build-catalyst" }]

[tasks.build-ios]
description = "Alias for build-sim"
run = [{ task = "build-sim" }]

[tasks.build-sim]
description = "Build the app for iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do
    case "$arg" in
        *=*) export "$arg" ;;
        *) echo "Unexpected argument: $arg" >&2; exit 64 ;;
    esac
done

ROOT_DIR="{{config_root}}"
WORKSPACE="${WORKSPACE:-${ROOT_DIR}/ModernUIKit.xcworkspace}"
PROJECT="${PROJECT:-${ROOT_DIR}/ModernUIKit.xcodeproj}"
IOS_SCHEME="${IOS_SCHEME:-ModernUIKit}"
CONFIGURATION="${CONFIGURATION:-Debug}"
DERIVED_DATA="${DERIVED_DATA:-${ROOT_DIR}/.DerivedData}"
BUILD_HOME="${BUILD_HOME:-${DERIVED_DATA}/home}"
XDG_CACHE_HOME="${XDG_CACHE_HOME:-${DERIVED_DATA}/xdg-cache}"
MODULE_CACHE="${MODULE_CACHE:-${DERIVED_DATA}/ModuleCache.noindex}"
SIMULATOR_DESTINATION="${SIMULATOR_DESTINATION:-generic/platform=iOS Simulator}"

mkdir -p "$BUILD_HOME" "$XDG_CACHE_HOME" "$MODULE_CACHE"
HOME="$BUILD_HOME" \
XDG_CACHE_HOME="$XDG_CACHE_HOME" \
CLANG_MODULE_CACHE_PATH="$MODULE_CACHE" \
SWIFTPM_MODULECACHE_OVERRIDE="$MODULE_CACHE" \
XCBUILD_LABEL=build-sim \
./Resources/DevKit/scripts/run_xcodebuild.sh \
    -workspace "$WORKSPACE" \
    -project "$PROJECT" \
    -configuration "$CONFIGURATION" \
    -derivedDataPath "$DERIVED_DATA" \
    CODE_SIGNING_ALLOWED=NO \
    CODE_SIGNING_REQUIRED=NO \
    CODE_SIGN_IDENTITY="" \
    -scheme "$IOS_SCHEME" \
    -destination "$SIMULATOR_DESTINATION" \
    build
'''

