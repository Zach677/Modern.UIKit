    CODE_SIGNING_ALLOWED=NO \
    CODE_SIGNING_REQUIRED=NO \
    CODE_SIGN_IDENTITY="" \
    -scheme "$IOS_SCHEME" \
    -destination "$CATALYST_TEST_DESTINATION" \
    SUPPORTS_MACCATALYST=YES \
