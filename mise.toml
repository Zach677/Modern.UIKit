# Template repository tasks. The app tasks live in template/mise.toml.
#
# mise also loads this file for commands that run inside template/. Do not add
# [tools] here, and do not reuse an app task name other than `check`.

[task_config]
dir = "{{config_root}}"

[tasks.test-tooling]
description = "Run the Python tests for template/Scripts and the uikit-starter skill"
run = [
    "python3 -m unittest discover -s Tests/Scripts",
    "python3 -m unittest discover -s skills/uikit-starter/tests",
]

[tasks.check]
description = "Run test-tooling, then generate an app from template/ and run its mise check"
run = [
    { task = "test-tooling" },
    '''
#!/usr/bin/env bash
set -euo pipefail
parent=$(mktemp -d)
trap 'rm -rf "$parent"' EXIT
python3 skills/uikit-starter/scripts/create_project.py \
    --repo CheckApp \
    --bundle-id org.example.CheckApp \
    --template-dir template \
    --parent-dir "$parent" \
    --no-remote \
    --verify check
''',
]
