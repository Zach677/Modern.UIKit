# App task automation.
#
# Build and test tasks route Xcode through the DevKit log-aware wrapper, which
# also owns derived-data placement and build cache isolation.
#
# Build/test tasks accept `KEY=value` overrides after `--`, for example
# `mise build -- CONFIGURATION=Release` or `mise test -- SIMULATOR_ID=<udid>`.

[task_config]
dir = "{{config_root}}"

[tasks.build]
description = "Build the app for iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do case "$arg" in *=*) export "$arg" ;; *) echo "Unexpected argument: $arg" >&2; exit 64 ;; esac; done
XCBUILD_LABEL=build ./Resources/DevKit/scripts/run_xcodebuild.sh \
    -workspace App.xcworkspace \
    -scheme App \
    -configuration "${CONFIGURATION:-Debug}" \
    -destination "generic/platform=iOS Simulator" \
    CODE_SIGNING_ALLOWED=NO \
    build
'''

[tasks.build-device]
description = "Build the app for a generic iOS device"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do case "$arg" in *=*) export "$arg" ;; *) echo "Unexpected argument: $arg" >&2; exit 64 ;; esac; done
XCBUILD_LABEL=build-device ./Resources/DevKit/scripts/run_xcodebuild.sh \
    -workspace App.xcworkspace \
    -scheme App \
    -configuration "${CONFIGURATION:-Debug}" \
    -destination "generic/platform=iOS" \
    CODE_SIGNING_ALLOWED=NO \
    build
'''

[tasks.run-ios]
description = "Build, install, and launch on an iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do case "$arg" in *=*) export "$arg" ;; *) echo "Unexpected argument: $arg" >&2; exit 64 ;; esac; done
mise run build "$@"

SIMULATOR_ID="${SIMULATOR_ID:-$(./Resources/DevKit/scripts/simulator_udid.py)}"
APP_PATH=".DerivedData/Build/Products/${CONFIGURATION:-Debug}-iphonesimulator/App.app"
BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")

xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
xcrun simctl bootstatus "$SIMULATOR_ID" -b
xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
'''

[tasks.test]
description = "Run Core package tests and hosted app tests"
run = [{ task = "test-core" }, { task = "test-app" }]

[tasks.test-core]
description = "Run Core package tests on macOS with swift test"
run = "swift test --package-path Packages/Core --quiet"

[tasks.test-app]
description = "Run hosted app tests on an iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do case "$arg" in *=*) export "$arg" ;; *) echo "Unexpected argument: $arg" >&2; exit 64 ;; esac; done
SIMULATOR_ID="${SIMULATOR_ID:-$(./Resources/DevKit/scripts/simulator_udid.py)}"
XCBUILD_LABEL=test-app ./Resources/DevKit/scripts/run_xcodebuild.sh \
    -workspace App.xcworkspace \
    -scheme App \
    -configuration "${CONFIGURATION:-Debug}" \
    -destination "id=$SIMULATOR_ID" \
    CODE_SIGNING_ALLOWED=NO \
    test
'''

[tasks.package-resolve]
description = "Resolve SwiftPM packages and refresh OpenSourceLicenses.md"
alias = "scan-license"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do
    case "$arg" in
        dirty=1) export ALLOW_DIRTY=1 ;;
        dirty=0) ;;
        *=*) export "$arg" ;;
        *) echo "Unexpected argument: $arg" >&2; exit 64 ;;
    esac
done
./Resources/DevKit/scripts/scan.license.sh
'''

[tasks.format]
description = "Run swiftformat and prettier in write mode"
run = '''
#!/usr/bin/env bash
set -euo pipefail
swiftformat . --swift-version 6.0 --exclude Vendor,build,.build,.DerivedData
npx --yes prettier --write .
'''

[tasks.format-lint]
description = "Run swiftformat and prettier in check mode"
run = '''
#!/usr/bin/env bash
set -euo pipefail
swiftformat . --swift-version 6.0 --exclude Vendor,build,.build,.DerivedData --lint
npx --yes prettier --check .
'''

[tasks.strip-xcstrings]
description = "Drop stale keys and mirror keys into en values"
run = "python3 ./Resources/DevKit/scripts/strip_stale_xcstrings.py"

[tasks.validate-xcstrings]
description = "Fail on stale, orphaned, or unregistered keys and missing translations"
run = "python3 ./Resources/DevKit/scripts/validate_xcstrings.py --require-locale zh-Hans"

[tasks.tidy-schemes]
description = "Rewrite workspace scheme visibility/order for Xcode"
run = "python3 ./Resources/DevKit/scripts/tidy_workspace_schemes.py"

[tasks.chore]
description = "Strip xcstrings, refresh licenses, tidy schemes, then format"
run = [
    { task = "strip-xcstrings" },
    { task = "package-resolve", args = ["dirty=1"] },
    { task = "tidy-schemes" },
    { task = "format" },
]

[tasks.clean]
description = "Remove derived data and SwiftPM build output"
run = "rm -rf .DerivedData Packages/Core/.build"
