[tasks.run-ios]
description = "Build, install, and launch on the booted iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for arg in "$@"; do
    case "$arg" in
        *=*) export "$arg" ;;
        *) echo "Unexpected argument: $arg" >&2; exit 64 ;;
    esac
done

ROOT_DIR="{{config_root}}"
WORKSPACE="${WORKSPACE:-${ROOT_DIR}/ModernUIKit.xcworkspace}"
PROJECT="${PROJECT:-${ROOT_DIR}/ModernUIKit.xcodeproj}"
IOS_SCHEME="${IOS_SCHEME:-ModernUIKit}"
CONFIGURATION="${CONFIGURATION:-Debug}"
DERIVED_DATA="${DERIVED_DATA:-${ROOT_DIR}/.DerivedData}"
BUILD_HOME="${BUILD_HOME:-${DERIVED_DATA}/home}"
XDG_CACHE_HOME="${XDG_CACHE_HOME:-${DERIVED_DATA}/xdg-cache}"
MODULE_CACHE="${MODULE_CACHE:-${DERIVED_DATA}/ModuleCache.noindex}"
SIMULATOR_DESTINATION="${SIMULATOR_DESTINATION:-generic/platform=iOS Simulator}"
SIMULATOR_DEVICE="${SIMULATOR_DEVICE:-booted}"
SIMULATOR_APP="${SIMULATOR_APP:-${DERIVED_DATA}/Build/Products/${CONFIGURATION}-iphonesimulator/${IOS_SCHEME}.app}"

mkdir -p "$BUILD_HOME" "$XDG_CACHE_HOME" "$MODULE_CACHE"
HOME="$BUILD_HOME" \
XDG_CACHE_HOME="$XDG_CACHE_HOME" \
CLANG_MODULE_CACHE_PATH="$MODULE_CACHE" \
SWIFTPM_MODULECACHE_OVERRIDE="$MODULE_CACHE" \
XCBUILD_LABEL=build-sim \
./Resources/DevKit/scripts/run_xcodebuild.sh \
    -workspace "$WORKSPACE" \
    -project "$PROJECT" \
    -configuration "$CONFIGURATION" \
    -derivedDataPath "$DERIVED_DATA" \
    CODE_SIGNING_ALLOWED=NO \
    CODE_SIGNING_REQUIRED=NO \
    CODE_SIGN_IDENTITY="" \
    -scheme "$IOS_SCHEME" \
    -destination "$SIMULATOR_DESTINATION" \
    build

test -d "$SIMULATOR_APP"
xcrun simctl bootstatus "$SIMULATOR_DEVICE" -b
xcrun simctl install "$SIMULATOR_DEVICE" "$SIMULATOR_APP"
BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$SIMULATOR_APP/Info.plist")
xcrun simctl launch "$SIMULATOR_DEVICE" "$BUNDLE_ID"
'''

[tasks.run-sim]
description = "Alias for run-ios"
run = [{ task = "run-ios" }]

[tasks.test]
description = "Run the full test suite on Mac Catalyst"
run = [{ task = "test-unit" }]

